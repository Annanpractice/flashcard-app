name: Build APK Keeper
on:
  push:
    paths:
      - '.github/workflows/chatgpt-apk-keeper.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android SDK 36
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Create project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/apk-keeper"
          mkdir -p "$ROOT/app/src/main/java/com/iain/apkkeeper" "$ROOT/app/src/main/res/values"
          echo '' | base64 -d > "$ROOT/settings.gradle.kts"
          echo 'cGx1Z2lucyB7IGlkKCJjb20uYW5kcm9pZC5hcHBsaWNhdGlvbiIpIHZlcnNpb24gIjkuNC4wIiBhcHBseSBmYWxzZSB9Cg==' | base64 -d > "$ROOT/build.gradle.kts"
          echo 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyZyAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD1mYWxzZQo=' | base64 -d > "$ROOT/gradle.properties"
          echo '' | base64 -d > "$ROOT/app/build.gradle.kts"
          echo '' | base64 -d > "$ROOT/app/src/main/AndroidManifest.xml"
          echo 'PHJlc291cmNlcz48c3R5bGUgbmFtZT0iQXBwVGhlbWUiIHBhcmVudD0iYW5kcm9pZDpzdHlsZS9UaGVtZS5NYXRlcmlhbC5MaWdodC5Ob0FjdGlvbkJhciI+PGl0ZW0gbmFtZT0iYW5kcm9pZDpmb250RmFtaWx5Ij5zYW5zPC9pdGVtPjxpdGVtIG5hbWU9ImFuZHJvaWQ6Y29sb3JBY2NlbnQiPiMyNDQ3RTg8L2l0ZW0+PC9zdHlsZT48L3Jlc291cmNlcz4K' | base64 -d > "$ROOT/app/src/main/res/values/styles.xml"
          echo '' | base64 -d > "$ROOT/app/src/main/java/com/iain/apkkeeper/MainActivity.java"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])/'apk-keeper/app/src/main/java/com/iain/apkkeeper/MainActivity.java'
          s=p.read_text()
          s=s.replace('if(out==null)|throw','if(out==null)throw')
          s=s.replace('for(int z;"z=in.read(b))!=-1;)','for(int z;(z=in.read(b))!=-1;)')
          s=s.replace('+" APK part"+a.files.size()==1?"":"s"))','+" APK part"+(a.files.size()==1?"":"s"))')
          p.write_text(s)
          PY
      - name: Build debug APK
        run: gradle -p "$RUNNER_TEMP/apk-keeper" :app:assembleDebug --no-daemon --stacktrace
      - name: Publish APK transfer branch
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/apk-keeper/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B chatgpt-apk-keeper-transfer
          cp "$APK" APK-Keeper.apk
          sha256sum APK-Keeper.apk > APK-Keeper.sha256
          git add APK-Keeper.apk APK-Keeper.sha256
          git commit -m 'Temporary APK Keeper transfer'
          git push --force origin HEAD:refs/heads/chatgpt-apk-keeper-transfer
