<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcards</title>
  <style>
    :root{
      --bg:#0e1222;
      --panel:#161b2e;
      --panel2:#202842;
      --text:#f4f6fb;
      --muted:#c5cbe0;
      --accent:#0072ce;
      --accent2:#005eb8;
      --good:#2dbf6e;
      --warn:#f1c40f;
      --bad:#e74c3c;
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --safe-bottom:env(safe-area-inset-bottom);
      --safe-right:env(safe-area-inset-right);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:linear-gradient(180deg,#0b1330 0%,#0e1222 60%);
      color:var(--text);
      -webkit-tap-highlight-color:transparent;
    }

    button,input,textarea,select{font:inherit}

    .topbar{
      position:fixed;
      inset:0 0 auto 0;
      z-index:20;
      display:grid;
      grid-template-columns:auto 1fr auto;
      gap:10px;
      align-items:center;
      padding:8px 12px;
      padding-right:calc(12px + var(--safe-right));
      background:rgba(7,10,24,.72);
      backdrop-filter:blur(8px);
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .drawer-toggle{
      width:36px;
      height:36px;
      display:grid;
      place-items:center;
      border:0;
      border-radius:10px;
      color:var(--text);
      background:rgba(255,255,255,.08);
      cursor:pointer;
      font-size:22px;
    }

    .actions{
      display:flex;
      gap:8px;
      overflow:auto;
      padding-bottom:2px;
    }

    .actions button,.counter button,.menu button{
      border:0;
      border-radius:10px;
      padding:7px 10px;
      cursor:pointer;
      white-space:nowrap;
    }

    .actions button{background:#fff;color:#111}
    .actions button.primary{background:var(--accent);color:#fff}

    .counter{
      position:relative;
      display:flex;
      align-items:center;
      gap:6px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.16);
      border-radius:999px;
      padding:4px 8px;
      white-space:nowrap;
    }

    #jump{
      width:52px;
      text-align:center;
      border:1px solid #4a5276;
      border-radius:8px;
      background:transparent;
      color:var(--text);
      font-weight:800;
      padding:2px 4px;
    }

    #jump::-webkit-inner-spin-button,#jump::-webkit-outer-spin-button{
      -webkit-appearance:none;
      margin:0;
    }

    .menu-btn{
      display:none;
      background:#fff;
      color:#111;
      padding:5px 9px!important;
    }

    .menu{
      position:absolute;
      top:44px;
      right:0;
      min-width:210px;
      display:none;
      flex-direction:column;
      overflow:hidden;
      background:#fff;
      color:#111;
      border-radius:12px;
      box-shadow:var(--shadow);
      z-index:50;
    }

    .menu button{
      background:#fff;
      color:#111;
      text-align:left;
      border-radius:0;
      padding:11px 13px;
    }

    .menu button:hover{background:#eef3ff}

    .filterbar{
      position:fixed;
      top:54px;
      left:0;
      right:0;
      z-index:19;
      display:flex;
      gap:10px;
      align-items:center;
      padding:8px 12px;
      background:rgba(7,10,24,.72);
      backdrop-filter:blur(8px);
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    .filterbar input[type=text]{
      flex:1;
      min-width:0;
      padding:8px 10px;
      border-radius:10px;
      border:1px solid #4a5276;
      background:var(--panel);
      color:var(--text);
    }

    .filterbar label{
      display:flex;
      gap:5px;
      align-items:center;
      font-size:14px;
      color:var(--muted);
    }

    .drawer{
      position:fixed;
      top:0;
      left:0;
      bottom:0;
      width:285px;
      z-index:40;
      transform:translateX(-105%);
      transition:transform .25s ease;
      background:var(--panel);
      color:var(--text);
      box-shadow:2px 0 18px rgba(0,0,0,.45);
      padding:14px;
      overflow:auto;
    }

    .drawer.open{transform:translateX(0)}
    .drawer h3{margin:0 0 12px}
    .drawer small{color:var(--muted)}

    .drawer-section{
      margin:12px 0;
      padding-top:12px;
      border-top:1px solid rgba(255,255,255,.1);
    }

    .topic-item{
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px;
      border-radius:9px;
      cursor:pointer;
      margin-bottom:4px;
      user-select:none;
    }

    .topic-item:hover{background:rgba(255,255,255,.08)}
    .topic-item.active{background:rgba(0,114,206,.32)}
    .ribbon{
      width:14px;
      height:14px;
      border-radius:3px;
      flex:0 0 auto;
      background:#888;
    }

    .topic-name{
      flex:1;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .badge{
      font-size:12px;
      color:var(--muted);
      background:rgba(255,255,255,.08);
      border-radius:999px;
      padding:2px 7px;
    }

    .wrap{
      width:min(92vw,780px);
      margin:124px auto 0;
      padding-bottom:155px;
    }

    .flashcard{
      position:relative;
      width:100%;
      aspect-ratio:4/3;
      border-radius:20px;
      overflow:hidden;
      box-shadow:var(--shadow);
      perspective:1000px;
      color:#101321;
    }

    .card-inner{
      position:absolute;
      inset:0;
      transition:transform .45s;
      transform-style:preserve-3d;
    }

    .card-inner.flipped{transform:rotateY(180deg)}

    .face{
      position:absolute;
      inset:0;
      padding:clamp(16px,3vw,30px);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      overflow:auto;
      backface-visibility:hidden;
      text-align:center;
      line-height:1.35;
    }

    .back{transform:rotateY(180deg)}
    .face img{max-width:92%;max-height:65%;object-fit:contain;margin-top:12px;border-radius:8px}
    .face.empty{color:#222;font-weight:800}

    .topic-chip{
      position:absolute;
      top:10px;
      left:10px;
      z-index:3;
      font-size:12px;
      color:#111;
      background:rgba(255,255,255,.65);
      border-radius:999px;
      padding:4px 9px;
      max-width:75%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .show{
      display:block;
      margin:16px auto 10px;
      padding:12px 22px;
      border:0;
      border-radius:999px;
      background:var(--accent);
      color:#fff;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 6px 18px rgba(0,0,0,.25);
      user-select:none;
      -webkit-user-select:none;
      -webkit-touch-callout:none;
    }

    .lock-pill{
      position:fixed;
      left:50%;
      bottom:calc(92px + var(--safe-bottom));
      transform:translateX(-50%);
      z-index:15;
      display:none;
      border:1px solid #555;
      border-radius:999px;
      background:#222;
      color:#fff;
      padding:8px 12px;
      font-weight:800;
      cursor:pointer;
    }

    .arrow{
      position:fixed;
      top:50%;
      transform:translateY(-50%);
      z-index:14;
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      border:0;
      border-radius:999px;
      background:rgba(0,0,0,.35);
      color:#fff;
      cursor:pointer;
      box-shadow:0 4px 16px rgba(0,0,0,.25);
      user-select:none;
    }

    .arrow.left{left:8px}
    .arrow.right{right:8px}

    .bottombar{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:18;
      display:flex;
      justify-content:center;
      gap:10px;
      padding:12px 12px calc(12px + var(--safe-bottom));
      background:rgba(7,10,24,.72);
      backdrop-filter:blur(8px);
      border-top:1px solid rgba(255,255,255,.08);
    }

    .bottombar button{
      border:0;
      border-radius:12px;
      padding:10px 14px;
      font-weight:900;
      cursor:pointer;
    }

    .good{background:var(--good);color:#fff}
    .bad{background:var(--bad);color:#fff}
    .warn{background:var(--warn);color:#111}

    .modal{
      position:fixed;
      inset:0;
      z-index:60;
      display:none;
      align-items:center;
      justify-content:center;
      padding:16px;
      background:rgba(0,0,0,.65);
    }

    .modal.open{display:flex}

    .modal-card{
      width:min(94vw,900px);
      max-height:92vh;
      overflow:auto;
      border-radius:16px;
      background:#fff;
      color:#111;
      padding:16px;
      box-shadow:var(--shadow);
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }

    .ed{
      min-height:130px;
      border:1px solid #cfd6ff;
      border-radius:10px;
      padding:10px;
      overflow:auto;
      background:#fff;
    }

    .toolbar{
      display:flex;
      gap:6px;
      align-items:center;
      margin:6px 0;
      flex-wrap:wrap;
    }

    .toolbar button,.modal-actions button{
      border:0;
      border-radius:9px;
      padding:7px 9px;
      cursor:pointer;
    }

    .toolbar button{background:#eef2ff;border:1px solid #cfd6ff}
    .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
    .primary{background:var(--accent)!important;color:#fff!important}
    .secondary{background:#555!important;color:#fff!important}

    .topic-input{
      width:100%;
      padding:8px 10px;
      border-radius:10px;
      border:1px solid #cfd6ff;
      margin-top:5px;
    }

    .colour-options{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin:7px 0 12px;
    }

    .colour-opt{
      width:26px;
      height:26px;
      border-radius:999px;
      border:3px solid transparent;
      cursor:pointer;
    }

    .colour-opt.selected{border-color:var(--accent)}

    .thumb{
      display:none;
      align-items:center;
      gap:8px;
      margin:7px 0;
    }

    .thumb img{
      max-height:54px;
      border-radius:7px;
      border:1px solid #ddd;
    }

    .devsig{
      position:fixed;
      right:10px;
      bottom:calc(136px + var(--safe-bottom));
      z-index:5;
      color:var(--muted);
      font-size:12px;
      pointer-events:none;
      user-select:none;
    }

    @media(max-width:760px){
      .actions{display:none}
      .menu-btn{display:inline-block}
      .grid{grid-template-columns:1fr}
      .wrap{margin-top:132px}
      .flashcard{aspect-ratio:3/4}
      .drawer{width:min(86vw,310px)}
    }

    @media(max-width:430px){
      .filterbar{gap:6px}
      .filterbar label{font-size:12px}
      .counter{font-size:13px}
      #jump{width:44px}
      .bottombar{gap:6px}
      .bottombar button{padding:9px 9px;font-size:13px}
      .arrow{width:36px;height:36px}
    }
  </style>
</head>
<body>
  <aside id="drawer" class="drawer">
    <h3>Flashcards</h3>
    <small id="deckSummary"></small>

    <div class="drawer-section">
      <strong>Views</strong>
      <div id="viewList"></div>
    </div>

    <div class="drawer-section">
      <strong>Topics</strong>
      <div id="topicList"></div>
    </div>
  </aside>

  <header class="topbar">
    <button id="drawerToggle" class="drawer-toggle" title="Topics and views">☰</button>

    <nav class="actions">
      <button onclick="fileInput.click()">Import</button>
      <button onclick="exportJSON()">Export JSON</button>
      <button onclick="exportTopic()">Export Topic</button>
      <button onclick="openModal()">Add</button>
      <button onclick="editCurrent()">Edit</button>
      <button class="primary" onclick="syncTopicPrompt()">Sync Topic</button>
    </nav>

    <div class="counter">
      <button id="menuBtn" class="menu-btn" onclick="toggleMenu()">⋮</button>
      <div id="menu" class="menu">
        <button onclick="openModal();toggleMenu(true)">Add</button>
        <button onclick="editCurrent();toggleMenu(true)">Edit</button>
        <button onclick="fileInput.click();toggleMenu(true)">Import</button>
        <button onclick="exportJSON();toggleMenu(true)">Export JSON</button>
        <button onclick="exportTopic();toggleMenu(true)">Export Topic</button>
        <button onclick="syncTopicPrompt();toggleMenu(true)">Sync Topic</button>
      </div>
      <input id="jump" type="number" min="1" value="0" />
      <span>/</span>
      <strong id="total">0</strong>
    </div>
  </header>

  <section class="filterbar">
    <input id="keywordInput" type="text" placeholder="Keyword filter question, answer, or topic…" />
    <label><input id="keywordToggle" type="checkbox" /> Enable</label>
  </section>

  <input id="fileInput" type="file" accept=".json,.cards,application/json" hidden />

  <main class="wrap">
    <section id="card" class="flashcard">
      <div id="cardInner" class="card-inner">
        <div id="front" class="face front"></div>
        <div id="back" class="face back"></div>
      </div>
    </section>
    <button id="showBtn" class="show" oncontextmenu="return false">Hold to Show Answer</button>
    <button id="lockPill" class="lock-pill" onclick="unlockAnswer()">Answer locked — tap to hide</button>
  </main>

  <button class="arrow left" title="Previous">◀</button>
  <button class="arrow right" title="Next">▶</button>

  <footer class="bottombar">
    <button class="good" onclick="markUnderstood()">Understood</button>
    <button class="good" onclick="markMastered()">Mastered</button>
    <button class="bad" onclick="deleteCurrent()">Delete</button>
    <button class="warn" onclick="undoDelete()">Undo</button>
  </footer>

  <div id="modal" class="modal">
    <div class="modal-card">
      <h3 id="modalTitle">Add Flashcard</h3>

      <div class="grid">
        <section>
          <label><strong>Question</strong></label>
          <div class="toolbar">
            <button type="button" onclick="fmt('bold')"><b>B</b></button>
            <button type="button" onclick="fmt('italic')"><i>I</i></button>
            <button type="button" onclick="fmt('underline')"><u>U</u></button>
            <input type="color" onchange="setTextColour(this.value)" />
            <select onchange="setTextSize(this.value)">
              <option value="">Size</option>
              <option value="2">Small</option>
              <option value="3">Normal</option>
              <option value="4">Large</option>
              <option value="5">X-Large</option>
            </select>
          </div>
          <div id="qEd" class="ed" contenteditable="true"></div>
          <label>Question image</label>
          <input id="qImg" type="file" accept="image/*" />
          <div id="qThumb" class="thumb">
            <img id="qThumbImg" alt="Question preview" />
            <button type="button" onclick="setThumb('q',null)">Remove</button>
          </div>
        </section>

        <section>
          <label><strong>Answer</strong></label>
          <div class="toolbar">
            <button type="button" onclick="fmt('bold')"><b>B</b></button>
            <button type="button" onclick="fmt('italic')"><i>I</i></button>
            <button type="button" onclick="fmt('underline')"><u>U</u></button>
            <input type="color" onchange="setTextColour(this.value)" />
            <select onchange="setTextSize(this.value)">
              <option value="">Size</option>
              <option value="2">Small</option>
              <option value="3">Normal</option>
              <option value="4">Large</option>
              <option value="5">X-Large</option>
            </select>
          </div>
          <div id="aEd" class="ed" contenteditable="true"></div>
          <label>Answer image</label>
          <input id="aImg" type="file" accept="image/*" />
          <div id="aThumb" class="thumb">
            <img id="aThumbImg" alt="Answer preview" />
            <button type="button" onclick="setThumb('a',null)">Remove</button>
          </div>
        </section>
      </div>

      <div style="margin-top:14px">
        <label><strong>Card colour</strong></label>
        <div id="colourOptions" class="colour-options"></div>

        <label><strong>Topic</strong></label>
        <input id="topicInput" class="topic-input" type="text" placeholder="Optional topic" />
      </div>

      <div class="modal-actions">
        <button class="primary" onclick="saveCard()">Save</button>
        <button class="secondary" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <div class="devsig">Developer: Iain Stewart ScotGEM 2025</div>

  <script>
    /***********************
     * State
     ***********************/
    const DB_NAME = 'flashcardsDB';
    const DB_STORE = 'decks';
    const DB_KEY = 'mainDeck';

    let cards = [];
    let understood = [];
    let mastered = [];

    let deckFilter = 'remaining'; // remaining | understood | mastered | all | random
    let topicFilter = null;
    let keywordFilter = '';
    let keywordEnabled = false;

    let current = 0;
    let showingAnswer = false;
    let locked = false;
    let editingId = null;
    let lastDeleted = null;
    let randomIds = [];

    const COLOURS = [
      '#FFEBEE','#E8F5E9','#E3F2FD','#FFFDE7','#F3E5F5',
      '#EFEBE9','#E8EAF6','#FBE9E7','#ECEFF1','#f7f9ff'
    ];

    let selectedColour = localStorage.getItem('preferredCardColor') || '#f7f9ff';
    let preferredTopic = localStorage.getItem('preferredTopic') || '';

    const fileInput = document.getElementById('fileInput');

    /***********************
     * Utilities
     ***********************/
    function uid(){
      return crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2);
    }

    function clone(obj){
      return JSON.parse(JSON.stringify(obj));
    }

    function ensureCards(arr){
      arr.forEach(c => {
        if(!c.id) c.id = uid();
        if(c.topic === undefined || c.topic === null) c.topic = '';
        if(!c.color) c.color = selectedColour;
        if(c.q === undefined) c.q = c.Question || '';
        if(c.a === undefined) c.a = c.Answer || '';
        if(c.qImg === undefined) c.qImg = c.QImage || null;
        if(c.aImg === undefined) c.aImg = c.AImage || null;
      });
    }

    function allCards(){
      return cards.concat(understood, mastered);
    }

    function cardLocation(id){
      let i = cards.findIndex(c => c.id === id);
      if(i >= 0) return {bucket:'cards', arr:cards, index:i};
      i = understood.findIndex(c => c.id === id);
      if(i >= 0) return {bucket:'understood', arr:understood, index:i};
      i = mastered.findIndex(c => c.id === id);
      if(i >= 0) return {bucket:'mastered', arr:mastered, index:i};
      return null;
    }

    function stripHTML(html){
      const d = document.createElement('div');
      d.innerHTML = html || '';
      return (d.textContent || d.innerText || '').trim();
    }

    function lighten(hex, lum=.08){
      let c = String(hex || '#f7f9ff').replace('#','');
      if(c.length === 3) c = c.split('').map(x => x+x).join('');
      const n = [0,2,4].map(i => parseInt(c.slice(i,i+2),16));
      return '#' + n.map(v => Math.min(255, Math.round(v + (255-v)*lum)).toString(16).padStart(2,'0')).join('');
    }

    function safeName(name){
      return String(name || 'topic').replace(/[^a-z0-9_-]+/gi,'_').replace(/^_+|_+$/g,'') || 'topic';
    }

    /***********************
     * Storage
     ***********************/
    function openDB(){
      return new Promise((resolve,reject)=>{
        const req = indexedDB.open(DB_NAME,1);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveToIndexedDB(data){
      const db = await openDB();
      return new Promise((resolve,reject)=>{
        const tx = db.transaction(DB_STORE,'readwrite');
        tx.objectStore(DB_STORE).put(data,DB_KEY);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadFromIndexedDB(){
      const db = await openDB();
      return new Promise((resolve,reject)=>{
        const tx = db.transaction(DB_STORE,'readonly');
        const req = tx.objectStore(DB_STORE).get(DB_KEY);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveState(){
      const data = {cards, understood, mastered};
      try{
        await saveToIndexedDB(data);
      }catch(err){
        console.warn('IndexedDB save failed:', err);
      }

      try{
        localStorage.setItem('flashcards', JSON.stringify(cards));
        localStorage.setItem('understoodCards', JSON.stringify(understood));
        localStorage.setItem('masteredCards', JSON.stringify(mastered));
      }catch(err){
        console.warn('localStorage save skipped, probably too large:', err);
      }
    }

    async function loadLocalState(){
      try{
        const cached = await loadFromIndexedDB();
        if(cached){
          cards = Array.isArray(cached.cards) ? cached.cards : [];
          understood = Array.isArray(cached.understood) ? cached.understood : [];
          mastered = Array.isArray(cached.mastered) ? cached.mastered : [];
          ensureCards(cards); ensureCards(understood); ensureCards(mastered);
          return true;
        }
      }catch(err){
        console.warn('IndexedDB load failed:', err);
      }

      try{
        cards = JSON.parse(localStorage.getItem('flashcards') || '[]');
        understood = JSON.parse(localStorage.getItem('understoodCards') || '[]');
        mastered = JSON.parse(localStorage.getItem('masteredCards') || '[]');
        ensureCards(cards); ensureCards(understood); ensureCards(mastered);
        return cards.length || understood.length || mastered.length;
      }catch(err){
        console.warn('localStorage load failed:', err);
        cards = []; understood = []; mastered = [];
        return false;
      }
    }

    /***********************
     * Active list
     ***********************/
    function baseList(){
      if(deckFilter === 'remaining') return cards;
      if(deckFilter === 'understood') return understood;
      if(deckFilter === 'mastered') return mastered;
      if(deckFilter === 'all') return allCards();
      if(deckFilter === 'random'){
        const base = allCards();
        if(randomIds.length === 0) randomIds = shuffle(base.map(c => c.id));
        const map = new Map(base.map(c => [c.id,c]));
        return randomIds.map(id => map.get(id)).filter(Boolean);
      }
      return cards;
    }

    function activeList(){
      let list = baseList();

      if(topicFilter){
        list = list.filter(c => c.topic === topicFilter);
      }

      if(keywordEnabled && keywordFilter){
        const kw = keywordFilter.toLowerCase();
        list = list.filter(c =>
          stripHTML(c.q).toLowerCase().includes(kw) ||
          stripHTML(c.a).toLowerCase().includes(kw) ||
          String(c.topic || '').toLowerCase().includes(kw)
        );
      }

      return list;
    }

    function shuffle(arr){
      for(let i=arr.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]] = [arr[j],arr[i]];
      }
      return arr;
    }

    function resetPosition(){
      current = 0;
      showingAnswer = false;
      locked = false;
    }

    function setDeckFilter(filter, topic = null){
      deckFilter = filter;
      topicFilter = topic;
      if(filter === 'random') randomIds = shuffle(allCards().map(c => c.id));
      resetPosition();
      render();
    }

    /***********************
     * Rendering
     ***********************/
    function render(){
      const list = activeList();
      const front = document.getElementById('front');
      const back = document.getElementById('back');
      const inner = document.getElementById('cardInner');
      const showBtn = document.getElementById('showBtn');
      const lockPill = document.getElementById('lockPill');

      if(current >= list.length) current = Math.max(0, list.length - 1);

      if(!list.length){
        const msg = topicFilter
          ? 'No cards match this topic/filter.'
          : 'No cards here. Add or import some.';
        front.className = 'face front empty';
        back.className = 'face back empty';
        front.innerHTML = msg;
        back.innerHTML = msg;
        front.style.background = '#f7f9ff';
        back.style.background = '#eef2ff';
        inner.classList.remove('flipped');
        showBtn.style.display = 'none';
        lockPill.style.display = 'none';
        updateUI();
        return;
      }

      const card = list[current];
      const bucket = cardLocation(card.id)?.bucket || 'cards';
      const prefix = bucket === 'understood' ? '<em>(Understood)</em><br>' :
                     bucket === 'mastered' ? '<em>(Mastered)</em><br>' : '';

      const topicChip = card.topic ? `<div class="topic-chip">${escapeHTML(card.topic)}</div>` : '';

      front.className = 'face front';
      back.className = 'face back';

      front.innerHTML = topicChip + prefix + (card.q || '') + (card.qImg ? `<br><img src="${card.qImg}" alt="">` : '');
      back.innerHTML = topicChip + prefix + (card.a || '') + (card.aImg ? `<br><img src="${card.aImg}" alt="">` : '');

      const clr = card.color || '#f7f9ff';
      front.style.background = clr;
      back.style.background = lighten(clr,.08);

      showBtn.style.display = 'block';
      inner.classList.toggle('flipped', showingAnswer);
      lockPill.style.display = locked ? 'block' : 'none';

      updateUI();
    }

    function escapeHTML(s){
      return String(s).replace(/[&<>"']/g, ch => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
      }[ch]));
    }

    function updateUI(){
      const list = activeList();
      document.getElementById('total').textContent = list.length;
      document.getElementById('jump').value = list.length ? current + 1 : 0;

      document.getElementById('deckSummary').textContent =
        `${cards.length} remaining · ${understood.length} understood · ${mastered.length} mastered`;

      updateDrawer();
    }

    function updateDrawer(){
      const viewList = document.getElementById('viewList');
      const topicList = document.getElementById('topicList');
      viewList.innerHTML = '';
      topicList.innerHTML = '';

      const views = [
        ['remaining','Remaining',cards.length,'#2dbf6e'],
        ['understood','Understood',understood.length,'#2196f3'],
        ['mastered','Mastered',mastered.length,'#9c27b0'],
        ['all','All',allCards().length,'#888'],
        ['random','Random',allCards().length,'#f1c40f']
      ];

      views.forEach(([key,label,count,colour]) => {
        viewList.appendChild(drawerItem(label, count, colour, deckFilter === key && !topicFilter, () => {
          closeDrawer();
          setDeckFilter(key,null);
        }));
      });

      const source = deckFilter === 'remaining' ? cards :
                     deckFilter === 'understood' ? understood :
                     deckFilter === 'mastered' ? mastered :
                     allCards();

      const topics = [...new Set(source.map(c => c.topic || '').filter(Boolean))].sort((a,b)=>a.localeCompare(b));

      if(!topics.length){
        const none = document.createElement('small');
        none.textContent = 'No topics in this view.';
        topicList.appendChild(none);
      }

      topics.forEach(topic => {
        const count = source.filter(c => c.topic === topic).length;
        const sample = source.find(c => c.topic === topic) || {};
        topicList.appendChild(drawerItem(topic, count, sample.color || '#888', topicFilter === topic, () => {
          topicFilter = topic;
          current = 0;
          showingAnswer = false;
          locked = false;
          closeDrawer();
          render();
        }));
      });
    }

    function drawerItem(label,count,colour,active,onClick){
      const div = document.createElement('div');
      div.className = 'topic-item' + (active ? ' active' : '');
      div.innerHTML = `
        <span class="ribbon" style="background:${colour}"></span>
        <span class="topic-name">${escapeHTML(label)}</span>
        <span class="badge">${count}</span>
      `;
      div.onclick = onClick;
      return div;
    }

    /***********************
     * Navigation / answer reveal
     ***********************/
    function nextCard(){
      const list = activeList();
      if(!list.length) return;
      current = (current + 1) % list.length;
      hideAnswer();
    }

    function prevCard(){
      const list = activeList();
      if(!list.length) return;
      current = (current - 1 + list.length) % list.length;
      hideAnswer();
    }

    function showAnswer(){
      showingAnswer = true;
      render();
    }

    function hideAnswer(){
      showingAnswer = false;
      locked = false;
      render();
    }

    function unlockAnswer(){
      locked = false;
      hideAnswer();
    }

    let startX = null;

    function onRevealDown(e){
      startX = e.touches ? e.touches[0].clientX : e.clientX;
      showAnswer();
    }

    function onRevealMove(e){
      if(startX === null) return;
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      if(x - startX > 70){
        locked = true;
        document.getElementById('lockPill').style.display = 'block';
      }
    }

    function onRevealUp(){
      if(!locked) hideAnswer();
      startX = null;
    }

    /***********************
     * Card actions
     ***********************/
    async function markUnderstood(){
      const card = activeList()[current];
      if(!card) return;

      const loc = cardLocation(card.id);
      if(!loc) return;

      if(loc.bucket === 'mastered') return;

      if(loc.bucket === 'cards'){
        cards.splice(loc.index,1);
        understood.push(card);
      }

      afterMutation();
    }

    async function markMastered(){
      const card = activeList()[current];
      if(!card) return;

      cards = cards.filter(c => c.id !== card.id);
      understood = understood.filter(c => c.id !== card.id);
      if(!mastered.some(c => c.id === card.id)) mastered.push(card);

      afterMutation();
    }

    async function deleteCurrent(){
      const card = activeList()[current];
      if(!card) return;

      const loc = cardLocation(card.id);
      if(!loc) return;

      lastDeleted = {
        card: clone(card),
        bucket: loc.bucket,
        index: loc.index
      };

      loc.arr.splice(loc.index,1);
      afterMutation();
    }

    async function undoDelete(){
      if(!lastDeleted) return;

      const target = lastDeleted.bucket === 'understood' ? understood :
                     lastDeleted.bucket === 'mastered' ? mastered : cards;

      if(!target.some(c => c.id === lastDeleted.card.id)){
        target.splice(Math.min(lastDeleted.index,target.length),0,lastDeleted.card);
      }

      lastDeleted = null;
      afterMutation();
    }

    async function afterMutation(){
      if(deckFilter === 'random') randomIds = randomIds.filter(id => allCards().some(c => c.id === id));
      const list = activeList();
      if(current >= list.length) current = Math.max(0, list.length - 1);
      hideAnswer();
      await saveState();
    }

    /***********************
     * Modal / editing
     ***********************/
    function openModal(){
      editingId = null;
      document.getElementById('modalTitle').textContent = 'Add Flashcard';
      document.getElementById('qEd').innerHTML = '';
      document.getElementById('aEd').innerHTML = '';
      setThumb('q',null);
      setThumb('a',null);
      document.getElementById('qImg').value = '';
      document.getElementById('aImg').value = '';
      document.getElementById('topicInput').value = topicFilter || preferredTopic || '';
      chooseColour(selectedColour,false);
      document.getElementById('modal').classList.add('open');
    }

    function closeModal(){
      document.getElementById('modal').classList.remove('open');
    }

    function editCurrent(){
      const card = activeList()[current];
      if(!card) return;

      editingId = card.id;
      document.getElementById('modalTitle').textContent = 'Edit Flashcard';
      document.getElementById('qEd').innerHTML = card.q || '';
      document.getElementById('aEd').innerHTML = card.a || '';
      setThumb('q',card.qImg || null);
      setThumb('a',card.aImg || null);
      document.getElementById('qImg').value = '';
      document.getElementById('aImg').value = '';
      document.getElementById('topicInput').value = card.topic || '';
      chooseColour(card.color || selectedColour,false);
      document.getElementById('modal').classList.add('open');
    }

    function readAsDataURL(file){
      return new Promise((resolve,reject)=>{
        const r = new FileReader();
        r.onload = e => resolve(e.target.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    async function saveCard(){
      const q = document.getElementById('qEd').innerHTML.trim();
      const a = document.getElementById('aEd').innerHTML.trim();
      const topic = document.getElementById('topicInput').value.trim();

      let qImg = getThumb('q');
      let aImg = getThumb('a');

      const qFile = document.getElementById('qImg').files[0];
      const aFile = document.getElementById('aImg').files[0];

      if(qFile) qImg = await readAsDataURL(qFile);
      if(aFile) aImg = await readAsDataURL(aFile);

      preferredTopic = topic;
      localStorage.setItem('preferredTopic',preferredTopic);
      localStorage.setItem('preferredCardColor',selectedColour);

      if(editingId){
        const loc = cardLocation(editingId);
        if(loc){
          Object.assign(loc.arr[loc.index], {
            q,a,topic,
            qImg:qImg || null,
            aImg:aImg || null,
            color:selectedColour
          });
        }
      }else{
        const card = {
          id:uid(),
          q,a,
          topic,
          qImg:qImg || null,
          aImg:aImg || null,
          color:selectedColour
        };
        cards.push(card);
        deckFilter = 'remaining';
        topicFilter = topic || null;
        current = activeList().findIndex(c => c.id === card.id);
        if(current < 0) current = 0;
      }

      closeModal();
      showingAnswer = false;
      locked = false;
      await saveState();
      render();
    }

    function setThumb(which,data){
      const box = document.getElementById(which + 'Thumb');
      const img = document.getElementById(which + 'ThumbImg');
      if(data){
        box.style.display = 'flex';
        img.src = data;
        box.dataset.value = data;
      }else{
        box.style.display = 'none';
        img.removeAttribute('src');
        box.dataset.value = '';
      }
    }

    function getThumb(which){
      return document.getElementById(which + 'Thumb').dataset.value || null;
    }

    function initColourOptions(){
      const box = document.getElementById('colourOptions');
      box.innerHTML = '';
      COLOURS.forEach(col => {
        const d = document.createElement('div');
        d.className = 'colour-opt';
        d.style.background = col;
        d.dataset.colour = col;
        d.onclick = () => chooseColour(col,true);
        box.appendChild(d);
      });
      chooseColour(selectedColour,false);
    }

    function chooseColour(colour,save=true){
      selectedColour = colour;
      document.querySelectorAll('.colour-opt').forEach(o => {
        o.classList.toggle('selected', o.dataset.colour === colour);
      });
      if(save) localStorage.setItem('preferredCardColor',selectedColour);
    }

    function fmt(cmd){ document.execCommand(cmd,false,null); }
    function setTextColour(c){ document.execCommand('foreColor',false,c); }
    function setTextSize(s){ if(s) document.execCommand('fontSize',false,s); }

    /***********************
     * Import / export
     ***********************/
    function exportJSON(){
      const blob = new Blob([JSON.stringify({cards,understood,mastered},null,2)], {type:'application/json'});
      downloadBlob(blob,'flashcards.json');
    }

    function exportTopic(){
      if(!topicFilter){
        alert('Please select a topic first.');
        return;
      }

      const list = allCards().filter(c => c.topic === topicFilter);
      if(!list.length){
        alert('No cards found for selected topic.');
        return;
      }

      const text = list.map((c,i) =>
        `${i+1}. ${stripHTML(c.q)}\n${stripHTML(c.a)}`
      ).join('\n\n');

      downloadBlob(new Blob([text],{type:'text/plain'}), safeName(topicFilter) + '.txt');
    }

    function downloadBlob(blob,name){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.click();
      URL.revokeObjectURL(url);
    }

    fileInput.addEventListener('change', async e => {
      const file = e.target.files[0];
      if(!file) return;

      try{
        const text = await file.text();
        const data = JSON.parse(text);

        cards = Array.isArray(data.cards) ? data.cards : Array.isArray(data) ? data : [];
        understood = Array.isArray(data.understood) ? data.understood :
                     Array.isArray(data.seen) ? data.seen : [];
        mastered = Array.isArray(data.mastered) ? data.mastered : [];

        ensureCards(cards); ensureCards(understood); ensureCards(mastered);

        deckFilter = 'remaining';
        topicFilter = null;
        randomIds = [];
        resetPosition();

        await saveState();
        render();
        alert('Deck imported and saved.');
      }catch(err){
        alert('Import failed: ' + (err.message || err));
      }finally{
        e.target.value = '';
      }
    });

    /***********************
     * Optional remote config / sync
     ***********************/
    async function loadConfig(){
      try{
        const res = await fetch('config.json', {cache:'no-store'});
        if(!res.ok) return null;
        const cfg = await res.json();
        if(cfg.scriptUrl) window.scriptUrl = cfg.scriptUrl;
        return cfg;
      }catch{
        return null;
      }
    }

    async function loadRemoteSheetIfConfigured(cfg){
      if(!cfg || !cfg.googleSheetID) return false;

      try{
        const sheetName = cfg.sheetName || 'Sheet1';
        const url = `https://opensheet.elk.sh/${cfg.googleSheetID}/${encodeURIComponent(sheetName)}`;
        const res = await fetch(url);
        if(!res.ok) return false;

        const rows = await res.json();
        const defaultColour = selectedColour;

        cards = rows.map(row => ({
          id:uid(),
          topic:row.Topic || row.topic || '',
          q:row.Question || row.question || row.q || '',
          a:row.Answer || row.answer || row.a || '',
          color:row.Colour || row.Color || row.colour || row.color || defaultColour,
          qImg:row.QImage || row.qImg || row.qimage || null,
          aImg:row.AImage || row.aImg || row.aimage || null
        }));

        understood = [];
        mastered = [];
        ensureCards(cards);
        await saveState();
        return true;
      }catch(err){
        console.warn('Remote sheet load failed:', err);
        return false;
      }
    }

    async function syncTopicPrompt(){
      if(!topicFilter){
        alert('Please select a topic first.');
        return;
      }

      const list = allCards().filter(c => c.topic === topicFilter);
      if(!list.length){
        alert('No cards found for selected topic. Sync cancelled.');
        return;
      }

      if(!confirm(`Sync ${list.length} card(s) for topic "${topicFilter}"? This may replace that topic on the server.`)){
        return;
      }

      try{
        await syncTopicWithServer(topicFilter,list);
        alert('Topic synced successfully.');
      }catch(err){
        alert('Error syncing topic: ' + (err.message || err));
      }
    }

    async function syncTopicWithServer(topic,cardsToSync){
      const url = window.scriptUrl || '';
      if(!url) throw new Error('scriptUrl not configured. Add it to config.json.');

      const payload = {
        action:'syncTopic',
        topic,
        cards:cardsToSync.map(c => ({
          topic:c.topic || topic,
          q:c.q || '',
          a:c.a || '',
          color:c.color || '',
          qImg:c.qImg || '',
          aImg:c.aImg || ''
        }))
      };

      const res = await fetch(url,{
        method:'POST',
        mode:'cors',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      });

      if(!res.ok){
        throw new Error(await res.text());
      }
    }

    /***********************
     * Drawer/menu/filter/events
     ***********************/
    function toggleDrawer(){
      document.getElementById('drawer').classList.toggle('open');
    }

    function closeDrawer(){
      document.getElementById('drawer').classList.remove('open');
    }

    function toggleMenu(forceClose=false){
      const m = document.getElementById('menu');
      if(forceClose) m.style.display = 'none';
      else m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
    }

    function addRepeat(btn,action){
      let timer = null;
      let delay = 500;
      function stop(){
        if(timer) clearTimeout(timer);
        timer = null;
      }
      btn.addEventListener('pointerdown', e => {
        e.preventDefault();
        action();
        delay = 500;
        const step = () => {
          timer = setTimeout(() => {
            action();
            delay = Math.max(80, delay * .85);
            step();
          }, delay);
        };
        step();
      });
      ['pointerup','pointerleave','pointercancel'].forEach(ev => btn.addEventListener(ev,stop));
    }

    document.getElementById('drawerToggle').addEventListener('click', e => {
      e.stopPropagation();
      toggleDrawer();
    });

    document.addEventListener('click', e => {
      const drawer = document.getElementById('drawer');
      const toggle = document.getElementById('drawerToggle');
      if(drawer.classList.contains('open') && !drawer.contains(e.target) && e.target !== toggle){
        closeDrawer();
      }

      const menu = document.getElementById('menu');
      const menuBtn = document.getElementById('menuBtn');
      if(menu.style.display === 'flex' && !menu.contains(e.target) && e.target !== menuBtn){
        menu.style.display = 'none';
      }
    });

    document.getElementById('keywordInput').addEventListener('input', e => {
      keywordFilter = e.target.value.trim();
      current = 0;
      if(keywordEnabled) render();
    });

    document.getElementById('keywordToggle').addEventListener('change', e => {
      keywordEnabled = e.target.checked;
      current = 0;
      render();
    });

    document.getElementById('jump').addEventListener('input', e => {
      const list = activeList();
      const n = parseInt(e.target.value,10);
      if(!isNaN(n) && n >= 1 && n <= list.length){
        current = n - 1;
        hideAnswer();
      }
    });

    document.addEventListener('keydown', e => {
      const t = e.target;
      if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;

      if(e.code === 'Space'){
        e.preventDefault();
        showingAnswer ? hideAnswer() : showAnswer();
      }else if(e.code === 'ArrowRight'){
        e.preventDefault();
        nextCard();
      }else if(e.code === 'ArrowLeft'){
        e.preventDefault();
        prevCard();
      }else if(e.key.toLowerCase() === 'm'){
        e.preventDefault();
        markMastered();
      }else if(e.key.toLowerCase() === 'u'){
        e.preventDefault();
        markUnderstood();
      }else if(e.key.toLowerCase() === 'd'){
        e.preventDefault();
        deleteCurrent();
      }
    });

    /***********************
     * Init
     ***********************/
    window.addEventListener('load', async () => {
      initColourOptions();

      const showBtn = document.getElementById('showBtn');
      showBtn.addEventListener('mousedown',onRevealDown);
      showBtn.addEventListener('mousemove',onRevealMove);
      showBtn.addEventListener('mouseup',onRevealUp);
      showBtn.addEventListener('mouseleave',onRevealUp);
      showBtn.addEventListener('touchstart',onRevealDown,{passive:true});
      showBtn.addEventListener('touchmove',onRevealMove,{passive:true});
      showBtn.addEventListener('touchend',onRevealUp);
      showBtn.addEventListener('touchcancel',onRevealUp);

      addRepeat(document.querySelector('.arrow.left'),prevCard);
      addRepeat(document.querySelector('.arrow.right'),nextCard);

      const cfg = await loadConfig();
      const hasLocal = await loadLocalState();

      if(!hasLocal && cfg){
        await loadRemoteSheetIfConfigured(cfg);
      }

      render();
    });
  </script>
